<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Мои финансы</title><style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#17171a;--muted:#777;--blue:#087aff;--green:#208544;--red:#d13b35} @media(prefers-color-scheme:dark){:root{--bg:#101012;--card:#202024;--text:#f5f5f7;--muted:#a5a5aa;--green:#55cf80;--red:#ff7671}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 110px}h1{font-size:30px;margin:0 0 20px}h2{font-size:19px}h3{margin:8px 0}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px;background:var(--card);color:var(--blue);cursor:pointer}button:disabled{opacity:.4}button.primary{background:var(--blue);color:white;font-weight:600;width:100%}button.danger{color:var(--red)}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}.muted,small{color:var(--muted)}.hero{text-align:center;padding:22px}.total{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin:8px 0}.plus{display:grid;place-items:center;margin:20px auto;width:82px;height:82px;border-radius:50%;background:var(--blue);color:white;padding:0;box-shadow:0 8px 24px #087aff35;-webkit-appearance:none;appearance:none}.plus-icon{display:block;width:44px;height:44px;stroke-width:2.6;flex:none;pointer-events:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{width:100%;text-align:left;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #8882;border-radius:0;background:none}.item:last-child{border-bottom:0}.item small{display:block;margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #8883;z-index:2}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0;max-width:150px;min-height:54px;font-size:12px;line-height:1.2;color:var(--muted);padding:8px 2px;background:transparent;-webkit-appearance:none;appearance:none}nav button.active{color:var(--blue)}nav .nav-icon{display:block;width:26px;height:26px;flex:none;pointer-events:none}nav span{display:block;font-size:12px;line-height:1.2;white-space:nowrap;pointer-events:none}dialog{border:0;border-radius:28px;background:var(--card);color:var(--text);position:fixed;inset:0;width:min(calc(100% - 32px),430px);max-width:calc(100% - 32px);max-height:calc(100vh - 64px);max-height:min(calc(100dvh - 64px - env(safe-area-inset-top) - env(safe-area-inset-bottom)),720px);margin:auto;padding:20px 20px 24px;overflow:auto;box-shadow:0 22px 70px rgba(0,0,0,.22),0 8px 24px rgba(0,0,0,.14)}dialog::backdrop{background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}label{display:block;color:var(--muted);font-size:14px;margin:14px 0 5px}input,select{width:100%;padding:12px;border:1px solid #8884;border-radius:12px;background:var(--bg);color:var(--text);min-height:45px}input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--blue)}.segments{display:flex;background:var(--bg);padding:4px;border-radius:12px;gap:3px;touch-action:pan-y}.segments button{flex:1;background:none;color:var(--muted);padding:10px 4px}.segments button.active{background:var(--card);color:var(--text);box-shadow:0 1px 5px #0002;font-weight:600}.amount{font-size:32px;text-align:center}.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.empty{text-align:center;color:var(--muted);padding:20px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{flex:1;background:var(--bg)}.notice{font-size:13px;color:var(--muted);line-height:1.5}.wrap{overflow-wrap:anywhere}.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.iconbtn{padding:12px 8px;font-size:24px;line-height:1;background:var(--bg);color:var(--text);border:1px solid #8883}.iconbtn.selected{outline:2px solid var(--blue);background:var(--card)}.day-group{margin:24px 0 0}.day-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 3px;margin-bottom:10px}.day-header h2{font-size:23px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.35px}.day-total{color:var(--muted);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}.day-card{margin:0;padding:4px 16px}.item .wrap{min-width:0;flex:1}.item-amount{flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}.day-card .item{min-height:56px}.comp-expect{margin:16px 0;padding:12px;border-radius:13px;background:var(--bg)}.comp-toggle{display:block;width:100%;background:var(--card);font-weight:600}.comp-toggle[aria-pressed="true"]{color:var(--muted)}.comp-expect small{display:block;margin-top:9px;line-height:1.35}.comp-pending{margin:0 0 10px;color:var(--blue);overflow-wrap:anywhere}
/* Consistent field dimensions in iOS Safari / standalone PWA. */
dialog form{width:100%;min-width:0;max-width:100%}
dialog input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;height:auto;box-sizing:border-box;-webkit-appearance:none;appearance:none;text-align:center}
dialog input[type="date"]::-webkit-date-and-time-value{min-width:0;margin:0;text-align:center}
dialog input[type="date"]::-webkit-datetime-edit{padding:0;min-width:0}
dialog .modal-focus-heading:focus{outline:none}
.modal-shell{display:flex;flex-direction:column;gap:10px}
.modal-shell>.row:first-child{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;gap:4px;position:sticky;top:0;background:var(--card);z-index:1;padding-bottom:4px}.modal-shell>.row:first-child h2{grid-column:2;text-align:center;margin:8px 0;line-height:1.2}.modal-shell>.row:first-child [data-close]{grid-column:3;justify-self:end}
.modal-close{width:38px;height:38px;display:grid;place-items:center;border-radius:999px;background:var(--bg);color:var(--muted);padding:0;line-height:1;flex:none}
.modal-close:hover{color:var(--text)}

/* Keep scrolling enabled, but suppress browser pinch and double-tap zoom. */
html,body,dialog,button,input,select,textarea{touch-action:pan-x pan-y}
.segments{touch-action:pan-y}
dialog input,dialog select,dialog textarea{font-size:16px}
dialog input.amount{font-size:32px}

/* Keep the top of a new-entry popup fixed when switching its type.
   The available height ends before the visible viewport's bottom edge. */
dialog.entry-anchored{top:var(--entry-top);bottom:auto;margin:0 auto;max-height:min(720px,var(--entry-room));overscroll-behavior:contain}
/* Entry sheet morph: the background, shape and position follow the + button. */
body.entry-from-plus main .plus,body.entry-from-debt main [data-add="debt"]{opacity:0}
dialog{transform-origin:center center}
dialog.entry-opening{overflow:hidden}
dialog.entry-opening>*{animation:entry-content-in 360ms ease both}
dialog.entry-opening::backdrop{animation:entry-shade-in 360ms ease both}
dialog.entry-closing{overflow:hidden;pointer-events:none}
dialog.entry-closing>*{animation:entry-content-out 150ms ease both}
dialog.entry-closing::backdrop{animation:entry-shade-out 270ms ease both}
@keyframes entry-content-in{0%,25%{opacity:0}100%{opacity:1}}
@keyframes entry-content-out{to{opacity:0}}
@keyframes entry-shade-in{from{background:transparent;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}to{background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}}
@keyframes entry-shade-out{from{background:rgba(0,0,0,.32);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}to{background:transparent;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px)}}
@media(prefers-reduced-motion:reduce){dialog.entry-opening>*,dialog.entry-closing>*,dialog.entry-opening::backdrop,dialog.entry-closing::backdrop{animation:none}}
/* Monthly statistics — self-contained, no chart libraries. */
.stats-month{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:4px;padding:6px;margin-bottom:14px}
.stats-month button{padding:0;width:40px;height:44px;display:grid;place-items:center;background:transparent}
.stats-arrow-icon{width:23px;height:23px;pointer-events:none}
.stats-month select{appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;font-weight:650;border:0;background:transparent;padding:8px 0;min-width:0;min-height:44px;font-size:16px}
.stats-summary{padding:18px 16px}.stats-summary-hero{text-align:center;padding:8px 0 14px}.stats-summary-hero .total{font-size:clamp(25px,8vw,40px);overflow-wrap:anywhere;font-variant-numeric:tabular-nums;margin:6px 0}
.stats-summary-rows{border-top:1px solid #8883;padding-top:9px;display:grid;gap:12px}.stats-summary-rows>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.stats-summary-rows span{font-size:14px;color:var(--muted);min-width:0}.stats-summary-rows strong{font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}.stats-pending{color:#ad6200}@media(prefers-color-scheme:dark){.stats-pending{color:#ff9f0a}}
.stats-mode{margin:18px 0 22px;background:var(--card);border:1px solid #8882}.stats-mode button{font-size:14px;padding:10px 3px}.stats-mode button.active{background:var(--bg)}
.stats-donut{position:relative;width:min(240px,100%);aspect-ratio:1;margin:0 auto 10px}.stats-donut svg{width:100%;height:100%;display:block}.stats-arc{cursor:pointer}.stats-donut-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px;pointer-events:none;padding:40px 32px;text-align:center}.stats-donut-center strong{font-size:clamp(16px,5vw,23px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere;max-width:100%}
.stats-category{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:8px;align-items:center;text-align:left;width:100%;padding:13px 0;background:transparent;color:var(--text);border-radius:0;border-bottom:1px solid #8882;font-size:14px}.stats-category:last-child{border-bottom:0}.stats-dot{width:9px;height:9px;border-radius:50%}.stats-cat-name{overflow-wrap:anywhere}.stats-category small{font-size:12px;white-space:nowrap}.stats-category strong{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:14px}
.stats-daily{padding:19px 13px 16px}.stats-plot{height:184px;margin:6px 0 29px 36px;position:relative}.stats-gridlines{position:absolute;inset:0;pointer-events:none}.stats-gridline{position:absolute;left:0;right:0;border-top:1px dashed #8884}.stats-gridline small{position:absolute;right:calc(100% + 5px);top:0;transform:translateY(-50%);font-size:10px;white-space:nowrap}.stats-columns{position:absolute;inset:0;display:grid;gap:2px}.stats-day{position:relative;border-radius:0;padding:0;min-width:0;width:100%;height:100%;background:none;color:var(--blue);display:flex;align-items:flex-end;justify-content:center;touch-action:pan-y}.stats-column{display:block;width:100%;max-width:16px;border-radius:3px 3px 0 0;background:var(--blue);pointer-events:none;min-height:0}.stats-day:not(.stats-zero) .stats-column{min-height:2px}.stats-zero .stats-column{height:1px!important;background:#8884}.stats-day:active .stats-column{opacity:.55}.stats-day-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);font-size:10px;pointer-events:none}.stats-metrics{border-top:1px solid #8883;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px}.stats-metrics>div{min-width:0;display:grid;gap:5px}.stats-metrics strong{font-size:16px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
@media(max-width:360px){.stats-category{gap:5px;font-size:13px}.stats-category strong{font-size:13px}.stats-summary-rows span{font-size:13px}.stats-summary-rows strong{font-size:14px}.stats-plot{margin-left:30px}.stats-columns{gap:1px}}

</style></head><body><main id="main"></main><nav id="nav"></nav><dialog id="modal"></dialog><script src="app.js"></script></body></html>
