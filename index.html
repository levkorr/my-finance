<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>Мои финансы</title><style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#17171a;--muted:#777;--blue:#087aff;--green:#208544;--red:#d13b35} @media(prefers-color-scheme:dark){:root{--bg:#101012;--card:#202024;--text:#f5f5f7;--muted:#a5a5aa;--green:#55cf80;--red:#ff7671}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:600px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 18px 110px}h1{font-size:30px;margin:0 0 20px}h2{font-size:19px}h3{margin:8px 0}button,input,select{font:inherit}button{border:0;border-radius:13px;padding:12px;background:var(--card);color:var(--blue);cursor:pointer}button:disabled{opacity:.4}button.primary{background:var(--blue);color:white;font-weight:600;width:100%}button.danger{color:var(--red)}.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0}.muted,small{color:var(--muted)}.hero{text-align:center;padding:22px}.total{font-size:40px;font-weight:750;letter-spacing:-1.5px;margin:8px 0}.plus{display:grid;place-items:center;margin:20px auto;width:82px;height:82px;border-radius:50%;background:var(--blue);color:white;padding:0;box-shadow:0 8px 24px #087aff35;-webkit-appearance:none;appearance:none}.plus-icon{display:block;width:44px;height:44px;stroke-width:2.6;flex:none;pointer-events:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{width:100%;text-align:left;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #8882;border-radius:0;background:none}.item:last-child{border-bottom:0}.item small{display:block;margin-top:4px}.positive{color:var(--green)}.negative{color:var(--red)}nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #8883;z-index:2}nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex:1;min-width:0;max-width:150px;min-height:54px;font-size:12px;line-height:1.2;color:var(--muted);padding:8px 2px;background:transparent;-webkit-appearance:none;appearance:none}nav button.active{color:var(--blue)}nav .nav-icon{display:block;width:26px;height:26px;flex:none;pointer-events:none}nav span{display:block;font-size:12px;line-height:1.2;white-space:nowrap;pointer-events:none}dialog{border:0;border-radius:24px 24px 0 0;background:var(--card);color:var(--text);width:min(100%,600px);max-width:100%;max-height:92dvh;margin:auto auto 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}dialog::backdrop{background:#0006}label{display:block;color:var(--muted);font-size:14px;margin:14px 0 5px}input,select{width:100%;padding:12px;border:1px solid #8884;border-radius:12px;background:var(--bg);color:var(--text);min-height:45px}input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--blue)}.segments{display:flex;background:var(--bg);padding:4px;border-radius:12px;gap:3px;touch-action:pan-y}.segments button{flex:1;background:none;color:var(--muted);padding:10px 4px}.segments button.active{background:var(--card);color:var(--text);box-shadow:0 1px 5px #0002;font-weight:600}.amount{font-size:32px;text-align:center}.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0 16px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.empty{text-align:center;color:var(--muted);padding:20px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.actions button{flex:1;background:var(--bg)}.notice{font-size:13px;color:var(--muted);line-height:1.5}.wrap{overflow-wrap:anywhere}.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.iconbtn{padding:12px 8px;font-size:24px;line-height:1;background:var(--bg);color:var(--text);border:1px solid #8883}.iconbtn.selected{outline:2px solid var(--blue);background:var(--card)}.day-group{margin:24px 0 0}.day-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 3px;margin-bottom:10px}.day-header h2{font-size:23px;line-height:1.2;margin:0;font-weight:750;letter-spacing:-.35px}.day-total{color:var(--muted);font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}.day-card{margin:0;padding:4px 16px}.item .wrap{min-width:0;flex:1}.item-amount{flex-shrink:0;white-space:nowrap;font-variant-numeric:tabular-nums}.day-card .item{min-height:56px}.comp-expect{margin:16px 0;padding:12px;border-radius:13px;background:var(--bg)}.comp-toggle{display:block;width:100%;background:var(--card);font-weight:600}.comp-toggle[aria-pressed="true"]{color:var(--muted)}.comp-expect small{display:block;margin-top:9px;line-height:1.35}.comp-pending{margin:0 0 10px;color:var(--blue);overflow-wrap:anywhere}</style></head><body><main id="main"></main><nav id="nav"></nav><dialog id="modal"></dialog><script src="app.js"></script></body></html>
